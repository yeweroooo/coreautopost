[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coreautopost"
version = "0.1.0"
description = "Headless Discord automation engine with TLS fingerprint impersonation and attachment streaming"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "yeweroooo" }]
dependencies = [
    "curl_cffi>=0.16.0",
    "websockets>=13.0",
]

[tool.setuptools]
py-modules = [
    "attachment",
    "builder",
    "client",
    "constants",
    "proxy",
    "session",
]
